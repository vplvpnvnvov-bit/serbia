name: Daily Prices
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node update-prices.js
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      - name: Deploy
        run: npx surge --project . --domain ${{ secrets.SURGE_DOMAIN }}
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
